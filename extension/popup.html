<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TorrentLite Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #ea580c;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      margin-bottom: 16px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #ea580c;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 9999px;
      border: none;
      background-color: #ea580c;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #c2410c;
    }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    .toggle-label {
      font-size: 12px;
      color: #cbd5e1;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ea580c;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .alert {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .alert-success {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }
    .alert-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="icon48.png" alt="Logo" class="logo" />
    <div>
      <div class="title">TorrentLite</div>
      <div class="subtitle">Integration Extension (IDM-Style)</div>
    </div>
  </div>

  <div class="status-badge">
    <span class="dot"></span> Native Host Active
  </div>

  <div class="form-group">
    <label for="torrentUrl">Download Magnet / Torrent URL:</label>
    <input type="text" id="torrentUrl" placeholder="Tempel magnet:?xt=urn:... atau URL .torrent" />
  </div>

  <button class="btn" id="btnSend">⚡ Kirim ke TorrentLite</button>

  <div id="msgBox" class="alert"></div>

  <div class="toggle-group">
    <span class="toggle-label">Cegat Unduhan .torrent Otomatis</span>
    <label class="switch">
      <input type="checkbox" id="autoIntercept" checked />
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
