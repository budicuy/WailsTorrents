name: Release TorrentLite Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails v3 & Task
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Setup UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build Frontend & Windows Binary
        shell: powershell
        run: |
          wails3 task prod

      - name: Compress Executable with UPX
        shell: powershell
        run: |
          upx --best --lzma bin/TorrentLite.exe

      - name: Prepare Artifact
        shell: powershell
        run: |
          Copy-Item bin/TorrentLite.exe bin/TorrentLite-Windows-amd64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentLite-Windows-amd64.exe
          path: bin/TorrentLite-Windows-amd64.exe

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4 & WebKitGTK 6.0 for Wails v3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config upx

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails v3 & Task
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Build Linux Binary
        run: |
          wails3 task prod

      - name: Compress Executable with UPX
        run: |
          upx --best --lzma bin/TorrentLite || true

      - name: Prepare Linux Tarball
        run: |
          chmod +x bin/TorrentLite
          mv bin/TorrentLite bin/TorrentLite-Linux-amd64
          tar -czvf bin/TorrentLite-Linux-amd64.tar.gz -C bin TorrentLite-Linux-amd64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentLite-Linux-amd64.tar.gz
          path: bin/TorrentLite-Linux-amd64.tar.gz

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails v3 & Task
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Build macOS Universal Binary
        run: |
          wails3 task darwin:build:universal PRODUCTION=true

      - name: Create macOS Zip Archive
        run: |
          chmod +x bin/TorrentLite
          cd bin
          zip -r TorrentLite-macOS-universal.zip TorrentLite

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentLite-macOS-universal.zip
          path: bin/TorrentLite-macOS-universal.zip

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Downloaded Files
        run: ls -R release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/TorrentLite-Windows-amd64.exe/TorrentLite-Windows-amd64.exe
            release-artifacts/TorrentLite-Linux-amd64.tar.gz/TorrentLite-Linux-amd64.tar.gz
            release-artifacts/TorrentLite-macOS-universal.zip/TorrentLite-macOS-universal.zip
          draft: false
          prerelease: false
          generate_release_notes: true
