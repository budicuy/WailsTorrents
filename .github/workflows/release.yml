name: Release TorrentLite Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Wails3 & Task Binaries
        uses: actions/cache@v4
        id: cache-gobin
        with:
          path: C:\Users\runneradmin\go\bin
          key: ${{ runner.os }}-gobin-wails3-v3

      - name: Install Wails v3 & Task
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Add Go bin to PATH
        shell: powershell
        run: |
          echo "C:\Users\runneradmin\go\bin" >> $env:GITHUB_PATH

      - name: Cache Frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('frontend/package.json') }}

      - name: Setup UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Install NSIS Installer Compiler
        shell: powershell
        run: |
          choco install nsis --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Frontend & Windows Production Binary
        shell: powershell
        run: |
          wails3 task prod

      - name: Compress Executable with UPX
        shell: powershell
        run: |
          upx --best --lzma bin/TorrentLite.exe

      - name: Package NSIS Installer
        shell: powershell
        run: |
          wails3 task windows:package

      - name: Prepare Windows Artifacts
        shell: powershell
        run: |
          Copy-Item bin/TorrentLite.exe bin/TorrentLite-Windows-Portable.exe
          if (Test-Path bin/TorrentLite-amd64-installer.exe) {
              Copy-Item bin/TorrentLite-amd64-installer.exe bin/TorrentLite-Windows-Setup.exe
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            bin/TorrentLite-Windows-Portable.exe
            bin/TorrentLite-Windows-Setup.exe

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4 & WebKitGTK 6.0 for Wails v3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config upx

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Wails3 & Task Binaries
        uses: actions/cache@v4
        id: cache-gobin
        with:
          path: /home/runner/go/bin
          key: ${{ runner.os }}-gobin-wails3-v3

      - name: Install Wails v3 & Task
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Add Go bin to PATH
        run: |
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      - name: Cache Frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('frontend/package.json') }}

      - name: Build Linux Binary
        run: |
          wails3 task prod

      - name: Compress Executable with UPX
        run: |
          upx --best --lzma bin/TorrentLite || true

      - name: Prepare Linux Tarball
        run: |
          chmod +x bin/TorrentLite
          mv bin/TorrentLite bin/TorrentLite-Linux-amd64
          tar -czvf bin/TorrentLite-Linux-amd64.tar.gz -C bin TorrentLite-Linux-amd64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentLite-Linux-amd64.tar.gz
          path: bin/TorrentLite-Linux-amd64.tar.gz

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Wails3 & Task Binaries
        uses: actions/cache@v4
        id: cache-gobin
        with:
          path: /Users/runner/go/bin
          key: ${{ runner.os }}-gobin-wails3-v3

      - name: Install Wails v3 & Task
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Add Go bin to PATH
        run: |
          echo "/Users/runner/go/bin" >> $GITHUB_PATH

      - name: Cache Frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('frontend/package.json') }}

      - name: Build macOS Universal Binary
        run: |
          wails3 task darwin:build:universal PRODUCTION=true

      - name: Create macOS Zip Archive
        run: |
          chmod +x bin/TorrentLite
          cd bin
          zip -r TorrentLite-macOS-universal.zip TorrentLite

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentLite-macOS-universal.zip
          path: bin/TorrentLite-macOS-universal.zip

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Downloaded Files
        run: ls -R release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/windows-binaries/TorrentLite-Windows-Portable.exe
            release-artifacts/windows-binaries/TorrentLite-Windows-Setup.exe
            release-artifacts/TorrentLite-Linux-amd64.tar.gz/TorrentLite-Linux-amd64.tar.gz
            release-artifacts/TorrentLite-macOS-universal.zip/TorrentLite-macOS-universal.zip
          draft: false
          prerelease: false
          generate_release_notes: true
